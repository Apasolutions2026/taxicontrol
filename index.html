<style>
/* Layout: app móvil de una columna (máx. 560px), letra y botones grandes, 4 pestañas abajo, hojas que suben desde abajo para apuntar */
:root{
  --bg:#F3F1EC; --surface:#FFFFFF; --surface-2:#F8F7F3; --ink:#14203A; --muted:#5E6577; --line:#E3E0D8;
  --navy:#16284F; --navy-ink:#FFFFFF; --coral:#EB5A43; --coral-ink:#FFFFFF;
  --good:#18865A; --good-soft:#E1F3EA; --bad:#C8352B; --bad-soft:#FCE6E3; --warn-soft:#FBF1DC; --warn:#9A6206;
  --fest:#D3261B; --fest-soft:#FDE2DE; --we:#6A4CD6; --we-soft:#EDE8FC; --rest:#8C93A3; --money:#16284F;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --fs:17px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C111D; --surface:#151C2D; --surface-2:#1B2338; --ink:#EEF1F7; --muted:#9FA8BC; --line:#29324A;
  --navy:#22397A; --navy-ink:#FFFFFF; --coral:#FF7259; --coral-ink:#1D0B07;
  --good:#45C98F; --good-soft:#143326; --bad:#FF7D70; --bad-soft:#3B1917; --warn-soft:#3A2D12; --warn:#F0B03E;
  --fest:#FF6F63; --fest-soft:#3C1816; --we:#AE9AFF; --we-soft:#272148; --rest:#7D869B; --money:#DDE4F5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C111D; --surface:#151C2D; --surface-2:#1B2338; --ink:#EEF1F7; --muted:#9FA8BC; --line:#29324A;
  --navy:#22397A; --navy-ink:#FFFFFF; --coral:#FF7259; --coral-ink:#1D0B07;
  --good:#45C98F; --good-soft:#143326; --bad:#FF7D70; --bad-soft:#3B1917; --warn-soft:#3A2D12; --warn:#F0B03E;
  --fest:#FF6F63; --fest-soft:#3C1816; --we:#AE9AFF; --we-soft:#272148; --rest:#7D869B; --money:#DDE4F5; color-scheme:dark}
:root.big{--fs:20px}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:var(--fs);line-height:1.4;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
body.locked::before{background:var(--bg)}
body.locked .top,body.locked .tabs{display:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;flex-direction:column;line-height:1}
.brand b{font-family:var(--f-num);font-size:1.5em;font-weight:700;color:var(--ink)}
.brand b i{font-style:normal;color:var(--coral)}
.brand small{font-size:.55em;letter-spacing:.16em;color:var(--muted);font-weight:600;margin-top:3px}
.who{font-size:.8em;color:var(--muted);font-weight:600;text-align:right;line-height:1.2;min-width:0}
.who b{display:block;color:var(--ink);font-size:1.1em}

main{padding-block:18px 120px;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--f-num);font-size:2em;font-weight:700;line-height:1.05;margin:0;text-wrap:balance}
h2{font-size:1.1em;font-weight:700;margin:0}
.sub{color:var(--muted);margin:2px 0 0;font-size:.95em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.help{font-size:.85em;color:var(--muted);margin:0}

.btn{border:0;border-radius:16px;padding:14px 18px;font-weight:700;font-size:1.05em;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:60px;transition:transform .08s;text-align:center}
.btn:active{transform:scale(.98)}
.btn.coral{background:var(--coral);color:var(--coral-ink);box-shadow:0 6px 18px color-mix(in srgb,var(--coral) 30%,transparent)}
.btn.primary{background:var(--navy);color:var(--navy-ink)}
.btn.green{background:var(--good);color:#fff}
.btn.ghost{background:var(--surface);border:2px solid var(--line);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{min-height:46px;font-size:.95em;padding:10px 14px;border-radius:12px}
.btn.block{width:100%}
.btn .ic{font-size:1.3em;line-height:1}
.btn:disabled{opacity:.6;cursor:wait}
.icon-btn{width:52px;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:1.6em;line-height:1;flex:none}
.icon-btn:disabled{opacity:.35}

.msw{display:flex;align-items:center;justify-content:space-between;gap:10px}
.msw strong{font-family:var(--f-num);font-size:1.3em;font-weight:700;text-transform:capitalize;text-align:center}

.demo{background:var(--warn-soft);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.9em}
.demo b{color:var(--warn)}

.month{background:var(--navy);color:var(--navy-ink);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.month::before{content:"";position:absolute;right:-30px;top:-50px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--coral) 55%,transparent),transparent 70%);opacity:.55;pointer-events:none}
.month .msw strong{color:#fff}
.month .icon-btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff}
.month .lbl{font-size:.8em;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.8;margin:0}
.month .big{font-family:var(--f-num);font-size:3.2em;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;margin:2px 0 0}
.month .days{font-size:.9em;opacity:.85;margin:4px 0 0}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:16px;padding:14px;min-width:0}
.tile span{display:block;font-size:.85em;font-weight:700}
.tile b{display:block;font-family:var(--f-num);font-size:2.1em;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile small{display:block;font-size:.78em;opacity:.85}
.tile.w{background:var(--good-soft);color:var(--good)}
.tile.l{background:var(--bad-soft);color:var(--bad)}
.tile.n{background:var(--surface-2);color:var(--ink)} .tile.n span{color:var(--muted)}
.month .tile.w{background:rgba(69,201,143,.18);color:#86E6BA}
.month .tile.l{background:rgba(255,125,112,.2);color:#FFB4AB}

.split{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.split i{display:block;height:100%}
.split .w{background:var(--good)} .split .l{background:var(--bad)}

.today-ok{display:flex;align-items:center;gap:14px;background:var(--good-soft);color:var(--good);border-radius:18px;padding:14px 16px;border:0;width:100%;text-align:left}
.today-ok.rest{background:var(--surface);border:2px dashed var(--rest);color:var(--muted)}
.today-ok .ic{font-size:1.6em}
.today-ok div{flex:1;min-width:0}
.today-ok b{display:block;font-size:1.05em}
.today-ok span{font-size:.9em;color:var(--ink)}
.today-ok em{font-style:normal;font-weight:700;text-decoration:underline}

.next-fest{display:flex;gap:14px;align-items:center}
.next-fest b{background:var(--fest-soft);color:var(--fest);border-radius:12px;padding:6px 10px;font-family:var(--f-num);font-size:1.2em;line-height:1.1;text-align:center;min-width:64px}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .h{font-size:.75em;color:var(--muted);text-align:center;font-weight:700}
.cal .h.we{color:var(--we)}
.cal .d{aspect-ratio:1/1.12;max-width:100%;border-radius:12px;background:var(--surface-2);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1em;font-weight:700;line-height:1.05;padding:0;color:var(--ink);position:relative;overflow:hidden;gap:2px}
.cal .d small{font-family:var(--f-num);font-size:.68em;font-weight:600}
.cal .d small.m{color:var(--good)}
.cal .d small.lost{color:var(--bad)}
.cal .d small.rs{color:var(--muted);font-family:var(--f-body);font-size:.55em;letter-spacing:.04em;text-transform:uppercase}
.cal .d.we{background:var(--we-soft);color:var(--we);border-color:color-mix(in srgb,var(--we) 35%,transparent)}
.cal .d.fest{background:var(--fest-soft);color:var(--fest);border-color:color-mix(in srgb,var(--fest) 50%,transparent)}
.cal .d.rest{background:repeating-linear-gradient(135deg,var(--surface-2) 0 5px,color-mix(in srgb,var(--rest) 22%,var(--surface-2)) 5px 8px);color:var(--muted);border-style:dashed;border-color:var(--rest)}
.cal .d.rest.fest{color:var(--fest)}
.cal .d.on{border-color:var(--good);border-width:2px}
.cal .d.today{outline:3px solid var(--ink);outline-offset:-3px}
.cal .d.blank{background:none;border:0}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.8em;color:var(--muted);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:16px;border-radius:5px;display:block;border:1.5px solid var(--line)}

.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.item:first-child{border-top:0}
.date{width:54px;flex:none;text-align:center;border-radius:12px;background:var(--surface-2);border:1.5px solid var(--line);padding:6px 0;line-height:1.05}
.date small{display:block;font-size:.65em;color:var(--muted);font-weight:700;text-transform:uppercase}
.date b{font-family:var(--f-num);font-size:1.45em}
.date.we{background:var(--we-soft);border-color:color-mix(in srgb,var(--we) 35%,transparent)} .date.we small,.date.we b{color:var(--we)}
.date.fest{background:var(--fest-soft);border-color:color-mix(in srgb,var(--fest) 50%,transparent)} .date.fest small,.date.fest b{color:var(--fest)}
.item .mid{flex:1;min-width:0}
.item .mid strong{display:block;font-weight:700}
.item .mid span{display:block;font-size:.85em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .mid span.l{color:var(--bad);font-weight:600}
.item .amt{font-family:var(--f-num);font-size:1.45em;font-weight:700;font-variant-numeric:tabular-nums;flex:none;color:var(--money)}
.empty{text-align:center;padding:18px 10px;color:var(--muted);margin:0}
.chip{display:inline-block;font-size:.8em;font-weight:700;padding:4px 10px;border-radius:99px;margin:0 4px 4px 0}
.chip.fest{background:var(--fest-soft);color:var(--fest)} .chip.we{background:var(--we-soft);color:var(--we)} .chip.rest{background:var(--surface-2);color:var(--muted);border:1.5px dashed var(--rest)}

.form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field>span{font-weight:700}
.field small{color:var(--muted);font-size:.85em;font-weight:500}
.form input,.form select,.form textarea{width:100%;min-width:0;background:var(--surface-2);border:2px solid var(--line);border-radius:14px;padding:14px;font-size:1.1em;color:var(--ink);font-weight:600;min-height:58px}
.form textarea{font-size:13px;font-weight:400;min-height:150px}
.form input:focus,.form select:focus,.form textarea:focus{outline:none;border-color:var(--navy)}
.bigin{display:flex;align-items:center;background:var(--surface-2);border:2px solid var(--line);border-radius:16px;padding:0 16px}
.bigin:focus-within{border-color:var(--navy)}
.form .bigin input{border:0;background:none;padding:6px 0;font-family:var(--f-num);font-size:2.4em;font-weight:700;outline:none;flex:1;min-width:0;font-variant-numeric:tabular-nums;min-height:0;box-shadow:none}
.bigin span{font-family:var(--f-num);font-size:1.8em;color:var(--muted);font-weight:700}
.stepper{display:grid;grid-template-columns:64px minmax(0,1fr) 64px;gap:10px;align-items:stretch}
.stepper button{border:0;border-radius:16px;background:var(--navy);color:var(--navy-ink);font-size:2em;font-weight:700;min-height:64px}
.stepper .bigin input{text-align:center}
.err{color:var(--bad);font-weight:700;margin:0;font-size:.95em}
.err:empty{display:none}
.r2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice button{border:2px solid var(--line);background:var(--surface);border-radius:16px;min-height:64px;font-weight:700;padding:8px;color:var(--muted)}
.choice button[aria-pressed="true"].si{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.choice button[aria-pressed="true"].no{background:var(--surface-2);color:var(--ink);border-color:var(--rest);border-style:dashed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:12px 18px;font-weight:700}
.chips button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border:2px solid var(--line);border-radius:16px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:12px;padding:12px 6px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}

.auth{display:flex;flex-direction:column;gap:18px;padding-block:32px 40px}
.auth .brand b{font-size:2.6em}
.auth .brand small{font-size:.7em}
.auth .claim{font-size:1.2em;margin:10px 0 0;font-weight:600;max-width:26ch}
.auth .claim em{font-style:normal;color:var(--bad)}

.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9em}
th{font-size:.75em;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:right;padding:6px 4px}
th:first-child,td:first-child{text-align:left}
td{padding:10px 4px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.cap{text-transform:capitalize;font-weight:600}
td.w,th.w{color:var(--good);font-weight:700} td.l,th.l{color:var(--bad);font-weight:700} td.a,th.a{color:var(--we);font-weight:700}
tr.off td{opacity:.4}
tr.tot td{font-weight:700;border-top:2px solid var(--ink)}

#sheet-root{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:rgba(8,12,22,.55);animation:fade .18s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:94%;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .22s cubic-bezier(.2,.8,.2,1);max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.grab{width:46px;height:5px;border-radius:99px;background:var(--line);margin:0 auto}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sheet-h h2{font-family:var(--f-num);font-size:1.6em;line-height:1.1}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding-block:6px}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;color:var(--muted);font-size:.8em;font-weight:700;border-radius:12px}
.tabs svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--ink);background:var(--surface-2)}
.tabs button[aria-current="page"] svg{stroke:var(--coral)}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:14px 20px;border-radius:16px;font-weight:700;z-index:60;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.foot{text-align:center;font-size:.75em;color:var(--muted);margin:0}
.foot b{color:var(--ink)} .foot b i{font-style:normal;color:var(--coral)}
</style>

</head>

function normalize(D){D=Object.assign(defaults(),D||{});D.settings=Object.assign(defaults().settings,D.settings||{});['jornadas','gastos','festivos'].forEach(k=>{if(!Array.isArray(D[k]))D[k]=[]});if(!D.dias||typeof D.dias!=='object')D.dias={};

  const byF={};D.jornadas.forEach(j=>{if(!j||!j.fecha)return;const imp=j.importe!==undefined?P(j.importe):P(j.efectivo)+P(j.tarjeta)+P(j.apps);const h=j.horas!==undefined&&j.horas!==''?P(j.horas):0;const o=byF[j.fecha]||(byF[j.fecha]={id:j.id||uid(),fecha:j.fecha,horas:0,importe:0});o.horas+=h;o.importe+=imp});
  D.jornadas=Object.values(byF).map(o=>Object.assign(o,{horas:Math.min(24,Math.round(o.horas*100)/100),importe:Math.round(o.importe*100)/100}));
  D.gastos=D.gastos.filter(g=>g&&g.fecha).map(g=>({id:g.id||uid(),fecha:g.fecha,concepto:g.concepto||({comb:'Gasoil',taller:'Taller',neum:'Taller',lavado:'Lavado',seguro:'Seguro',autonomo:'Autónomos'}[g.cat]||'Otros'),importe:P(g.importe)}));
  Object.keys(D.dias).forEach(f=>{D.dias[f]={estado:D.dias[f]&&D.dias[f].estado==='disponible'?'disponible':'descanso'}});
  return D}

function demoData(){
  const D=defaults();let seed=20261111;const r=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const now=new Date(),start=new Date(now.getFullYear(),now.getMonth()-2,1);
  Object.assign(D.settings,{nombre:'Javier',licencia:'08412',demo:true,descanso:0,desde:iso(start)});
  const t=todayIso(),baja=iso(new Date(now.getFullYear(),now.getMonth()-1,23));D.dias[baja]={estado:'descanso'};
  for(let d=new Date(start);iso(d)<t;d.setDate(d.getDate()+1)){const f=iso(d),dow=d.getDay();
    if(d.getDate()===1)D.gastos.push({id:uid(),fecha:f,concepto:'Autónomos',importe:294});
    if(d.getDate()===5)D.gastos.push({id:uid(),fecha:f,concepto:'Seguro',importe:112.5});
    if(dow===0||f===baja||r()<.09)continue;
    const h=Math.round((7.5+r()*4)*2)/2;D.jornadas.push({id:uid(),fecha:f,horas:h,importe:Math.round(h*(18+r()*9))});
    if(r()<.38)D.gastos.push({id:uid(),fecha:f,concepto:'Gasoil',importe:Math.round((48+r()*25)*100)/100});
    if(dow===6&&r()<.6)D.gastos.push({id:uid(),fecha:f,concepto:'Lavado',importe:12});}
  D.gastos.push({id:uid(),fecha:iso(new Date(now.getFullYear(),now.getMonth()-1,17)),concepto:'Taller',importe:186.3});
  return D}

async function hashPw(u,pw,salt){const txt=salt+'|'+u+'|'+pw;try{if(crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}
  let h1=5381,h2=52711;for(let i=0;i<txt.length;i++){const c=txt.charCodeAt(i);h1=(h1*33)^c;h2=(h2*33)^c}return 'f'+(h1>>>0).toString(16)+(h2>>>0).toString(16)}

/* Cada día que se puede trabajar vale HD() horas. Horas perdidas = HD() − horas trabajadas. Los días de descanso no cuentan. */
function diaInfo(f){
  const j=jOf(f),mark=S.dias[f],dow=dObj(f).getDay(),fe=festOf(f),semanal=+S.settings.descanso===dow;
  const rest=(mark&&mark.estado==='descanso')||(semanal&&!(mark&&mark.estado==='disponible'));
  const h=j?P(j.horas):0,t=todayIso(),counts=f>=S.settings.desde&&(f<t||(f===t&&!!j));
  const lost=counts&&!rest?Math.max(0,HD()-h):0;
  return{f,dow,fe,j,rest,semanal,exc:semanal&&mark&&mark.estado==='disponible',h,imp:j?P(j.importe):0,counts,lost};
}
function monthData(ym){const n=daysIn(ym),o={ym,lab:0,desc:0,trab:0,lost:0,dTrab:0,imp:0,gastos:0,days:[]};
  for(let d=1;d<=n;d++){const i=diaInfo(ym+'-'+pad(d));o.days.push(i);if(i.j){o.trab+=i.h;o.dTrab++;o.imp+=i.imp}if(i.counts){if(i.rest)o.desc++;else{o.lab++;o.lost+=i.lost}}}
  S.gastos.forEach(g=>{if(g.fecha.startsWith(ym))o.gastos+=P(g.importe)});return o}
function yearData(y){const ms=[];let acc=0;for(let m=1;m<=12;m++){const o=monthData(y+'-'+pad(m));acc+=o.lost;o.acc=acc;ms.push(o)}
  const T={lab:0,desc:0,trab:0,lost:0,dTrab:0,imp:0,gastos:0};ms.forEach(o=>Object.keys(T).forEach(k=>T[k]+=o[k]));return{ms,T}}

function mountAuth(){
  $('#f-auth').addEventListener('submit',async e=>{e.preventDefault();const err=$('#au-err'),btn=$('#f-auth button[type=submit]'),u=$('#au-u').value.trim().toLowerCase(),pw=$('#au-p').value;err.textContent='';

      if(UI.auth==='crear'){
        if(u==='demo'){err.textContent='Ese usuario ya existe. Elige otro.';return}

        NEW_PROFILE={nombre:$('#au-n').value.trim(),descanso:+$('#au-d').value,desde:todayIso()};
        let cred;try{cred=await sb.createUserWithEmailAndPassword(toEmail(u),pw)}
        catch(error){NEW_PROFILE=null;const c=error.code||'';err.textContent=c.includes('email-already')?'Ese usuario ya existe. Elige otro.':c.includes('weak-password')?'La contraseña es muy corta. Pon al menos 6 caracteres.':c.includes('too-many')?'Demasiados intentos. Espera unos minutos.':c.includes('network')?'No hay internet. Prueba otra vez.':'No se ha podido crear la cuenta. Prueba otra vez.';return}
        await enterCloud(cred.user);toast('¡Cuenta creada!');
      }else{
        let cred;try{cred=await sb.signInWithEmailAndPassword(toEmail(u),pw)}
        catch(error){const c=error.code||'';err.textContent=/invalid|wrong-password|user-not-found/.test(c)?'Usuario o contraseña incorrectos.':c.includes('too-many')?'Demasiados intentos. Espera unos minutos.':'No se puede entrar ahora. Mira que tengas internet.';return}

  const wg=wb.addWorksheet('Gastos '+y,{views:[{state:'frozen',ySplit:5}],properties:{tabColor:{argb:C.mH}}});
  top(wg,`Gastos ${y}`,3);head(wg,5,['Fecha','Concepto','Importe (€)'],[C.navy,C.navy,C.mH]);[14,24,16].forEach((w,i)=>wg.getColumn(i+1).width=w);
  const GY=S.gastos.filter(g=>g.fecha.startsWith(y+'-')).sort((a,b)=>a.fecha.localeCompare(b.fecha));let gr=6;
  GY.forEach(g=>{const row=wg.getRow(gr);row.values=[dObj(g.fecha),g.concepto,P(g.importe)];row.getCell(1).numFmt='dd/mm/yyyy';row.getCell(3).numFmt=E;row.eachCell({includeEmpty:true},c=>c.border=bd);gr++});
  if(GY.length){const t3=wg.getRow(gr);t3.values=['TOTAL','',{formula:`SUM(C6:C${gr-1})`,result:GY.reduce((a,g)=>a+P(g.importe),0)}];totStyle(t3,[C.navy,C.navy,C.mH]);t3.getCell(3).numFmt=E}

  [ws,wd,wg].forEach(s=>{s.pageSetup={orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0,paperSize:9}});
  return new Blob([await wb.xlsx.writeBuffer()],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
async function downloadExcel(btn,y){const label=btn.innerHTML;btn.disabled=true;btn.textContent='Preparando…';
  try{const blob=await buildExcel(y),name=`TaxiControl_${(S.settings.nombre||USER).replace(/[^\wÀ-ÿ-]+/g,'_')}_${y}.xlsx`;
    if(DL){try{await DL.save({filename:name,data:blob});toast('Excel descargado');return}catch(e){if(e&&e.code==='declined'){toast('Descarga cancelada');return}if(e&&e.code==='rate_limited'){toast('Espera un momento y prueba otra vez');return}}}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);toast('Excel descargado');
  }catch(e){console.error(e);toast('No se ha podido crear el Excel. Mira que tengas internet y prueba otra vez.')}
  finally{btn.disabled=false;btn.innerHTML=label}}

function copyText(txt){const fb=()=>sheet('Copia este texto',`<div class="form"><textarea readonly id="cp">${esc(txt)}</textarea><p class="help">Mantén pulsado el texto, elige «Seleccionar todo» y luego «Copiar».</p></div>`,el=>{const t=el.querySelector('#cp');t.focus();t.select()});
  try{navigator.clipboard.writeText(txt).then(()=>toast('Copia guardada. Pégala en tus notas o en WhatsApp.'),fb)}catch(e){fb()}}
function restoreSheet(){sheet('Recuperar copia',`<form class="form" id="fr"><label class="field" for="r-t"><span>Pega aquí tu copia</span><textarea id="r-t"></textarea></label><p class="err" id="r-err"></p><button class="btn primary block" type="submit">Recuperar</button></form>`,el=>{
  el.querySelector('#fr').addEventListener('submit',e=>{e.preventDefault();try{const o=JSON.parse($('#r-t').value.trim()),d=o.data||o;if(!Array.isArray(d.jornadas))throw 0;S=normalize(d);S.settings.demo=USER==='demo';save();closeSheet();go('inicio');toast('Copia recuperada')}catch(_){$('#r-err').textContent='Ese texto no es una copia de TaxiControl.'}})})}

const ACT={
  go:t=>go(t.dataset.v),auth:t=>{UI.auth=t.dataset.k;render()},demo:()=>login('demo'),logout:()=>logout(),close:()=>closeSheet(),
  m:t=>{UI.month=addMonth(UI.month,+t.dataset.d);if(UI.month>curYm())UI.month=curYm();render()},
  day:t=>daySheet(t.dataset.f),jornada:t=>jornadaSheet(t.dataset.f||todayIso()),setday:t=>setDay(t.dataset.f,t.dataset.k),
  step:t=>{const i=$('#j-h');let v=parseH(i.value)+ +t.dataset.d;v=Math.max(0,Math.min(24,Math.round(v*2)/2));i.value=String(v).replace('.',',')},
  gasto:t=>gastoSheet(t.dataset.id),excel:t=>downloadExcel(t,+t.dataset.y),
  big:t=>{const on=t.dataset.k==='1';document.documentElement.classList.toggle('big',on);ls.set(BIG,on?'1':'');render()},
  backup:()=>copyText(JSON.stringify({app:'TaxiControl',v:3,data:S})),restore:()=>restoreSheet(),
  arm:t=>{if(!t.classList.contains('armed')){t.dataset.orig=t.innerHTML;t.classList.add('armed');t.textContent='¿Seguro? Pulsa otra vez';setTimeout(()=>{if(t.isConnected&&t.classList.contains('armed')){t.classList.remove('armed');t.innerHTML=t.dataset.orig}},4000);return}
    const id=t.dataset.id;
    switch(t.dataset.do){
      case'del-j':S.jornadas=S.jornadas.filter(j=>j.fecha!==id);toast('Día borrado');break;
      case'del-g':S.gastos=S.gastos.filter(g=>g.id!==id);toast('Gasto borrado');break;
      case'del-fest':S.festivos=S.festivos.filter(x=>x.f!==id);toast('Festivo quitado');break;
      case'wipe':if(USER==='demo'){S=demoData();save();go('inicio');toast('Ejemplo reiniciado');return}
        {(async()=>{try{if(sb&&UID){await docRef().delete()}ls.del(dKey(USER));PENDING=false;S=null;await logout();toast('Datos borrados')}catch(e){toast('No se ha podido borrar. Mira que tengas internet.')}})();return}}
    save();closeSheet();render()}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=ACT[t.dataset.act];if(f){e.preventDefault();f(t,e)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet-root').hidden)closeSheet()});
if(ls.get(BIG))document.documentElement.classList.add('big');
document.body.classList.add('locked');$('#view').innerHTML='<div class="auth"><p class="empty">Cargando…</p></div>';
(async()=>{const ses=ls.get(SES);
  if(ses==='demo'){login('demo');return}
  if(sb){const user=await new Promise(res=>{const off=sb.onAuthStateChanged(u=>{off();res(u)});setTimeout(()=>res(null),8000)});if(user){await enterCloud(user);return}}
  render()})();
})();
